# IMPORTANT: These are placeholder values.
# In production use sealed-secrets, external-secrets-operator, or Vault.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stream-sentinel.fullname" . }}-secrets
  namespace: {{ include "stream-sentinel.namespace" . }}
  labels:
    {{- include "stream-sentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
type: Opaque
data:
  REDIS_PASSWORD: {{ .Values.secrets.redis.password | quote }}
  POSTGRES_USER: {{ .Values.secrets.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgres.password | quote }}
  CLICKHOUSE_USER: {{ .Values.secrets.clickhouse.user | quote }}
  CLICKHOUSE_PASSWORD: {{ .Values.secrets.clickhouse.password | quote }}
  KAFKA_USERNAME: {{ .Values.secrets.kafka.username | quote }}
  KAFKA_PASSWORD: {{ .Values.secrets.kafka.password | quote }}
  SCHEMA_REGISTRY_USERNAME: {{ .Values.secrets.schemaRegistry.username | quote }}
  SCHEMA_REGISTRY_PASSWORD: {{ .Values.secrets.schemaRegistry.password | quote }}
