name: Wait for Infrastructure Services
description: >
  Polls Kafka, Redis, PostgreSQL, and ClickHouse containers until they report
  healthy, or fails after a timeout.  Designed to run after
  `docker compose -f docker/docker-compose.yml up -d`.

runs:
  using: composite
  steps:
    - name: Wait for services to be healthy
      shell: bash
      run: |
        echo "Waiting for Kafka..."
        for i in $(seq 1 60); do
          if docker exec stream-sentinel-kafka kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1; then
            echo "Kafka is ready"
            break
          fi
          if [ $i -eq 60 ]; then
            echo "Kafka failed to start"
            docker compose -f docker/docker-compose.yml logs kafka
            exit 1
          fi
          sleep 2
        done

        echo "Waiting for Redis..."
        for i in $(seq 1 30); do
          if docker exec stream-sentinel-redis redis-cli ping | grep -q PONG; then
            echo "Redis is ready"
            break
          fi
          if [ $i -eq 30 ]; then
            echo "Redis failed to start"
            docker compose -f docker/docker-compose.yml logs redis
            exit 1
          fi
          sleep 2
        done

        echo "Waiting for PostgreSQL..."
        for i in $(seq 1 30); do
          if docker exec stream-sentinel-postgres pg_isready -U stream_sentinel_user -d stream_sentinel > /dev/null 2>&1; then
            echo "PostgreSQL is ready"
            break
          fi
          if [ $i -eq 30 ]; then
            echo "PostgreSQL failed to start"
            docker compose -f docker/docker-compose.yml logs postgres
            exit 1
          fi
          sleep 2
        done

        # ClickHouse (alpine) runs user/db creation + init SQL on first boot,
        # so /ping can take well over 60s on a cold runner. Allow up to 180s.
        echo "Waiting for ClickHouse..."
        for i in $(seq 1 90); do
          if docker exec stream-sentinel-clickhouse wget --quiet --tries=1 --spider http://localhost:8123/ping 2>/dev/null; then
            echo "ClickHouse is ready"
            break
          fi
          if [ $i -eq 90 ]; then
            echo "ClickHouse failed to start"
            docker compose -f docker/docker-compose.yml logs clickhouse
            exit 1
          fi
          sleep 2
        done

        echo "All services are healthy"
