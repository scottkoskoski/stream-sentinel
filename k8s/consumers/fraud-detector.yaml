apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detector
  namespace: stream-sentinel
  labels:
    app.kubernetes.io/name: fraud-detector
    app.kubernetes.io/component: consumer
    app.kubernetes.io/part-of: stream-sentinel
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: fraud-detector
      app.kubernetes.io/component: consumer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraud-detector
        app.kubernetes.io/component: consumer
        app.kubernetes.io/part-of: stream-sentinel
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: stream-sentinel
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - fraud-detector
                topologyKey: kubernetes.io/hostname
      containers:
        - name: fraud-detector
          image: stream-sentinel-consumer:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m"]
          args: ["src.consumers.fraud_detector", "--batch", "--batch-size", "32", "--batch-timeout-ms", "100"]
          ports:
            - name: metrics
              containerPort: 8000
              protocol: TCP
          env:
            - name: METRICS_PORT
              value: "8000"
          envFrom:
            - configMapRef:
                name: stream-sentinel-config
            - secretRef:
                name: stream-sentinel-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readiness
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: models
              mountPath: /app/models
              readOnly: true
      volumes:
        - name: models
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: fraud-detector
  namespace: stream-sentinel
  labels:
    app.kubernetes.io/name: fraud-detector
    app.kubernetes.io/component: consumer
    app.kubernetes.io/part-of: stream-sentinel
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fraud-detector
    app.kubernetes.io/component: consumer
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics
      protocol: TCP
