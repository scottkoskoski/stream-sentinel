apiVersion: apps/v1
kind: Deployment
metadata:
  name: dlq-consumer
  namespace: stream-sentinel
  labels:
    app.kubernetes.io/name: dlq-consumer
    app.kubernetes.io/component: consumer
    app.kubernetes.io/part-of: stream-sentinel
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dlq-consumer
      app.kubernetes.io/component: consumer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dlq-consumer
        app.kubernetes.io/component: consumer
        app.kubernetes.io/part-of: stream-sentinel
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8004"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: stream-sentinel
      terminationGracePeriodSeconds: 60
      containers:
        - name: dlq-consumer
          image: stream-sentinel-consumer:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m"]
          args: ["src.consumers.dlq_consumer"]
          ports:
            - name: metrics
              containerPort: 8004
              protocol: TCP
          env:
            - name: METRICS_PORT
              value: "8004"
          envFrom:
            - configMapRef:
                name: stream-sentinel-config
            - secretRef:
                name: stream-sentinel-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12

---
apiVersion: v1
kind: Service
metadata:
  name: dlq-consumer
  namespace: stream-sentinel
  labels:
    app.kubernetes.io/name: dlq-consumer
    app.kubernetes.io/component: consumer
    app.kubernetes.io/part-of: stream-sentinel
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dlq-consumer
    app.kubernetes.io/component: consumer
  ports:
    - name: metrics
      port: 8004
      targetPort: metrics
      protocol: TCP
