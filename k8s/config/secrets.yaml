# Stream-Sentinel Secrets
#
# IMPORTANT -- This file contains BASE64-ENCODED placeholder values only.
# Do NOT commit real credentials to version control.
#
# Production recommendation:
#   Use one of the following instead of raw Kubernetes Secrets:
#     - Bitnami Sealed Secrets  (https://sealed-secrets.netlify.app/)
#     - External Secrets Operator  (https://external-secrets.io/)
#     - HashiCorp Vault  (via vault-secrets-operator)
#     - AWS Secrets Manager / GCP Secret Manager with CSI driver
#
# To generate a base64 value:
#   echo -n 'my-secret-value' | base64

apiVersion: v1
kind: Secret
metadata:
  name: stream-sentinel-secrets
  namespace: stream-sentinel
  labels:
    app.kubernetes.io/name: stream-sentinel
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: stream-sentinel
type: Opaque
data:
  # Redis password -- echo -n 'CHANGEME-redis-password' | base64
  REDIS_PASSWORD: Q0hBTkdFTUUtcmVkaXMtcGFzc3dvcmQ=

  # PostgreSQL credentials -- echo -n 'CHANGEME-postgres-password' | base64
  POSTGRES_USER: c3RyZWFtX3NlbnRpbmVsX3VzZXI=
  POSTGRES_PASSWORD: Q0hBTkdFTUUtcG9zdGdyZXMtcGFzc3dvcmQ=

  # ClickHouse credentials -- echo -n 'CHANGEME-clickhouse-password' | base64
  CLICKHOUSE_USER: c3RyZWFtX3NlbnRpbmVsX3VzZXI=
  CLICKHOUSE_PASSWORD: Q0hBTkdFTUUtY2xpY2tob3VzZS1wYXNzd29yZA==

  # Kafka SASL credentials (if SASL is enabled on the cluster)
  KAFKA_USERNAME: c3RyZWFtX3NlbnRpbmVsX3VzZXI=
  KAFKA_PASSWORD: Q0hBTkdFTUUta2Fma2EtcGFzc3dvcmQ=

  # Schema Registry credentials
  SCHEMA_REGISTRY_USERNAME: c2NoZW1hX3JlZ2lzdHJ5X3VzZXI=
  SCHEMA_REGISTRY_PASSWORD: Q0hBTkdFTUUtc2NoZW1hLXJlZ2lzdHJ5LXBhc3N3b3Jk
